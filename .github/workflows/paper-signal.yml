name: PAPER signal

# Runs every 30 minutes on GitHub's servers (your laptop can be off).
# Each run: fetch Papertrade's public stats -> update the dashboard data ->
# message Telegram if the signal changed. Read-only: no wallet, no trading.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}          # "Run workflow" button for a manual check

permissions:
  contents: write                # to commit docs/data.json for the dashboard

concurrency:
  group: paper-signal
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remembers the last signal and your Telegram chat between runs
      - name: Restore bot memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: paper-state-

      - name: Check signal, update dashboard, notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.PAPERWATCHER }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOSS_USD: ${{ vars.LOSS_USD || '1000' }}
          TARGET_DAYS: ${{ vars.TARGET_DAYS || '30' }}
        run: python notify.py

      - name: Save bot memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: paper-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Commit only docs/data.json on top of the latest main, so a re-run of an
      # old run (or a code change pushed meanwhile) can never cause a conflict.
      - name: Publish dashboard data
        run: |
          git config user.name  "paper-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/data.json "$RUNNER_TEMP/data.json"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/data.json" docs/data.json
            git add docs/data.json
            if git diff --cached --quiet; then echo "No dashboard change"; exit 0; fi
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            echo "push raced, retrying ($attempt)"; sleep 5
          done
          exit 1
